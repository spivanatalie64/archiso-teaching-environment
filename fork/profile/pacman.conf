#
# Vesper — build-time pacman configuration.
#
# Read this before changing it: there are two pacman configurations in play and
# they are not the same file.
#
#   THIS file  governs the *build*. `mkarchiso` reads it, flattens it with
#               `pacman-conf`, and hands the result to `pacstrap` to populate
#               the image's root filesystem. Whatever mirrors are named here are
#               the mirrors the image's packages come from.
#
#   THE IMAGE  governs the *running system*. It lives at /etc/pacman.conf inside
#               the ISO and is written by the pacman hook in
#               airootfs/etc/pacman.d/hooks/50-vesper-runtime-config.hook,
#               because packages own /etc/pacman.conf and would otherwise
#               overwrite anything dropped there beforehand.
#
# Upstream's baseline profile conflates the two. That is lesson 04.
#
# ---------------------------------------------------------------------------
# The mirrors are written out in full rather than pulled in with `Include`.
#
# pacman resolves a relative `Include` against the *current working directory*,
# not against the directory holding the file that contains the `Include` line.
# `mkarchiso` invokes `pacman-conf --config <profile>/pacman.conf` from
# whatever directory the user happened to be in, so a profile that says
# `Include = mirrorlist` builds successfully from one directory and fails from
# another. A profile must not depend on the invoking directory, so the servers
# are written here directly.
# ---------------------------------------------------------------------------

[options]
Architecture = auto
HoldPkg     = pacman glibc
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
