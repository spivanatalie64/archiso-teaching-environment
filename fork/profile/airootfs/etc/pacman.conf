#
# Vesper — runtime pacman configuration.
#
# This is the file the *running image* reads. It is a different file from the
# build-time configuration in ../../pacman.conf, and the difference is not
# cosmetic.
#
# How this file survives the build:
#
#   /etc/pacman.conf is declared `Backup =` by the `pacman` package. When a
#   Backup file already exists on disk and differs from the packaged version,
#   pacman installs the packaged version as /etc/pacman.conf.pacnew and leaves
#   the existing file alone. The overlay in airootfs/ is copied into the image
#   before the package transaction runs, so this file is in place when pacman
#   gets there, and it is still here afterwards.
#
#   The Arch default it displaced is left behind as /etc/pacman.conf.pacnew.
#   That is not a wart. It is a thing to open and compare.
#
# The mirrors are written out inline rather than pulled in with
# `Include = /etc/pacman.d/mirrorlist`, because `mkarchiso` calls `pacstrap`
# with `-c`, and `pacstrap` copies the *build host's* mirrorlist over the
# image's own once the transaction is done. Anything in the image that relied
# on that file would silently be reading the builder's configuration instead.
#
# See issue #5 for the full account.

[options]
Architecture = auto
HoldPkg     = pacman glibc
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
